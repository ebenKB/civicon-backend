<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"
     font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="journey" gradientUnits="userSpaceOnUse" x1="191" y1="0" x2="1729" y2="0">
      <stop offset="0%"   stop-color="#2C7A78"/>
      <stop offset="18%"  stop-color="#E0A526"/>
      <stop offset="42%"  stop-color="#1F6B69"/>
      <stop offset="72%"  stop-color="#E0A526"/>
      <stop offset="100%" stop-color="#2E9E5B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="34%" r="70%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF3F2"/>
    </radialGradient>
    <filter id="card" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0F3B3A" flood-opacity="0.10"/>
    </filter>
    <marker id="tip" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#A9B4B2"/>
    </marker>
    <marker id="tipAmber" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#D9A43A"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- the title block lives in the slide, not the artwork; this recentres what is left -->
  <g transform="translate(0,-58)">

  <!-- two places a person decides: before anyone may touch it, and before anyone is paid -->
  <rect x="342" y="296" width="210" height="298" rx="36" fill="#E0A526" opacity="0.09"/>
  <rect x="342" y="296" width="210" height="298" rx="36" fill="none" stroke="#D9A43A" stroke-width="2"
        stroke-dasharray="3 10" opacity="0.5"/>
  <text x="447" y="276" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="3.5" fill="#B9861A">SAFETY GATE</text>

  <rect x="1111" y="296" width="467" height="298" rx="36" fill="#E0A526" opacity="0.09"/>
  <rect x="1111" y="296" width="467" height="298" rx="36" fill="none" stroke="#D9A43A" stroke-width="2"
        stroke-dasharray="3 10" opacity="0.5"/>
  <text x="1344" y="276" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="3.5" fill="#B9861A">THE TRUST LAYER</text>

  <!-- the journey, one continuous track the cards sit on -->
  <rect x="191" y="410.5" width="1538" height="9" rx="4.5" fill="url(#journey)"/>
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
    <path d="M 313 407 L 322 415 L 313 423"/>
    <path d="M 569 407 L 578 415 L 569 423"/>
    <path d="M 826 407 L 835 415 L 826 423"/>
    <path d="M 1082 407 L 1091 415 L 1082 423"/>
    <path d="M 1338 407 L 1347 415 L 1338 423"/>
    <path d="M 1595 407 L 1604 415 L 1595 423"/>
  </g>

  <!-- the loop: a verified fix brings the next report -->
  <path d="M 1729 566 C 1729 836 1480 886 960 886 C 440 886 191 836 191 574"
        fill="none" stroke="#A9B4B2" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="2 11" marker-end="url(#tip)"/>
  <text x="960" y="934" text-anchor="middle" font-size="22" fill="#8A9795">and the cycle repeats</text>

  <!-- cards -->
  <g filter="url(#card)">
    <rect x="100"  y="330" width="182" height="230" rx="26" fill="#FFFFFF"/>
    <rect x="356"  y="330" width="182" height="230" rx="26" fill="#FFFFFF"/>
    <rect x="613"  y="330" width="182" height="230" rx="26" fill="#FFFFFF"/>
    <rect x="869"  y="330" width="182" height="230" rx="26" fill="#FFFFFF"/>
    <rect x="1125" y="330" width="182" height="230" rx="26" fill="#FFFFFF"/>
    <rect x="1382" y="330" width="182" height="230" rx="26" fill="#FFFFFF"/>
    <rect x="1638" y="330" width="182" height="230" rx="26" fill="#FFFFFF"/>
  </g>
  <g fill="none" stroke="#E6ECEB" stroke-width="1.5">
    <rect x="100"  y="330" width="182" height="230" rx="26"/>
    <rect x="613"  y="330" width="182" height="230" rx="26"/>
    <rect x="869"  y="330" width="182" height="230" rx="26"/>
    <rect x="1638" y="330" width="182" height="230" rx="26"/>
  </g>
  <g fill="none" stroke="#E0A526" stroke-width="2.5">
    <rect x="356"  y="330" width="182" height="230" rx="26"/>
    <rect x="1125" y="330" width="182" height="230" rx="26"/>
    <rect x="1382" y="330" width="182" height="230" rx="26"/>
  </g>

  <!-- icon wells -->
  <circle cx="191"  cy="415" r="44" fill="#2C7A78" opacity="0.10"/>
  <circle cx="447"  cy="415" r="44" fill="#E0A526" opacity="0.16"/>
  <circle cx="704"  cy="415" r="44" fill="#1F6B69" opacity="0.10"/>
  <circle cx="960"  cy="415" r="44" fill="#1F6B69" opacity="0.10"/>
  <circle cx="1216" cy="415" r="44" fill="#E0A526" opacity="0.16"/>
  <circle cx="1473" cy="415" r="44" fill="#3B5BA5" opacity="0.12"/>
  <circle cx="1729" cy="415" r="44" fill="#2E9E5B" opacity="0.12"/>

  <!-- 1. Report: a photograph of the problem -->
  <g fill="none" stroke="#2C7A78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="165" y="400" width="52" height="34" rx="7"/>
    <path d="M 181 400 l 4 -9 h 12 l 4 9"/>
    <circle cx="191" cy="417" r="9.5"/>
  </g>

  <!-- 2. Safety check: is this work for a member of the public at all? -->
  <g fill="none" stroke="#B9861A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 447 390 L 475 440 L 419 440 Z"/>
    <line x1="447" y1="408" x2="447" y2="422"/>
    <circle cx="447" cy="430" r="1.8" fill="#B9861A"/>
  </g>

  <!-- 3. Claim: a volunteer plants a flag -->
  <g fill="none" stroke="#1F6B69" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <line x1="690" y1="390" x2="690" y2="442"/>
    <path d="M 690 394 L 728 406 L 690 418 Z"/>
  </g>

  <!-- 4. Fix and submit: the work itself -->
  <g fill="none" stroke="#1F6B69" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="960" cy="415" r="17"/>
    <circle cx="960" cy="415" r="7.5"/>
    <g>
      <rect x="956" y="391" width="8" height="9" rx="2"/>
      <rect x="956" y="391" width="8" height="9" rx="2" transform="rotate(45 960 415)"/>
      <rect x="956" y="391" width="8" height="9" rx="2" transform="rotate(90 960 415)"/>
      <rect x="956" y="391" width="8" height="9" rx="2" transform="rotate(135 960 415)"/>
      <rect x="956" y="391" width="8" height="9" rx="2" transform="rotate(180 960 415)"/>
      <rect x="956" y="391" width="8" height="9" rx="2" transform="rotate(225 960 415)"/>
      <rect x="956" y="391" width="8" height="9" rx="2" transform="rotate(270 960 415)"/>
      <rect x="956" y="391" width="8" height="9" rx="2" transform="rotate(315 960 415)"/>
    </g>
  </g>

  <!-- 5. AI checks: before against after -->
  <g fill="none" stroke="#B9861A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1184" y="396" width="34" height="27" rx="4" fill="#FFFFFF"/>
    <path d="M 1189 417 l 7 -8 l 5 5 l 6 -7 l 7 10"/>
    <rect x="1204" y="414" width="34" height="27" rx="4" fill="#FFFFFF"/>
    <path d="M 1209 435 l 7 -8 l 5 5 l 6 -7 l 7 10"/>
    <circle cx="1242" cy="396" r="11"/>
    <line x1="1250" y1="404" x2="1257" y2="411"/>
  </g>

  <!-- 6. Confirm: a person with authority signs it off -->
  <g fill="none" stroke="#3B5BA5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 1473 388 L 1501 399 L 1501 417 C 1501 433 1489 442 1473 446 C 1457 442 1445 433 1445 417 L 1445 399 Z"/>
    <path d="M 1461 414 L 1469 423 L 1486 404"/>
  </g>

  <!-- 7. Points -->
  <g fill="none" stroke="#2E9E5B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="1729" cy="415" r="30"/>
    <path d="M 1729 395 L 1734 408.1 L 1748 408.8 L 1737.1 417.6 L 1740.8 431.2 L 1729 423.5 L 1717.2 431.2 L 1720.9 417.6 L 1710 408.8 L 1724 408.1 Z"/>
  </g>

  <!-- role pills, straddling each card's top edge -->
  <g font-size="16" font-weight="700" letter-spacing="2" text-anchor="middle" fill="#FFFFFF">
    <rect x="136"  y="313" width="110" height="34" rx="17" fill="#2C7A78"/><text x="191"  y="335">CITIZEN</text>
    <rect x="417"  y="313" width="60"  height="34" rx="17" fill="#E0A526"/><text x="447"  y="335">AI</text>
    <rect x="634"  y="313" width="140" height="34" rx="17" fill="#1F6B69"/><text x="704"  y="335">VOLUNTEER</text>
    <rect x="890"  y="313" width="140" height="34" rx="17" fill="#1F6B69"/><text x="960"  y="335">VOLUNTEER</text>
    <rect x="1186" y="313" width="60"  height="34" rx="17" fill="#E0A526"/><text x="1216" y="335">AI</text>
    <rect x="1420" y="313" width="106" height="34" rx="17" fill="#3B5BA5"/><text x="1473" y="335">AGENCY</text>
    <rect x="1659" y="313" width="140" height="34" rx="17" fill="#1F6B69"/><text x="1729" y="335">VOLUNTEER</text>
  </g>

  <!-- labels -->
  <g text-anchor="middle" fill="#0F3B3A" font-size="27" font-weight="700">
    <text x="191"  y="528">Report</text>
    <text x="447"  y="528">Safety check</text>
    <text x="704"  y="528">Claim</text>
    <text x="960"  y="528">Fix &amp; Submit</text>
    <text x="1216" y="528">AI checks</text>
    <text x="1473" y="528">Confirm</text>
    <text x="1729" y="528">Points</text>
  </g>

  <!-- where a person decides instead -->
  <path d="M 447 566 L 447 694" fill="none" stroke="#D9A43A" stroke-width="3"
        stroke-linecap="round" marker-end="url(#tipAmber)"/>
  <path d="M 600 730 C 662 706 704 648 704 572" fill="none" stroke="#C7B48A" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="2 10" marker-end="url(#tipAmber)"/>
  <rect x="297" y="700" width="300" height="120" rx="24" fill="#FFFDF5" stroke="#E7D4A8" stroke-width="2"/>
  <circle cx="359" cy="760" r="26" fill="#E0A526" opacity="0.14"/>
  <g fill="none" stroke="#B9861A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="359" cy="752" r="11"/>
    <path d="M 341 780 a 18 18 0 0 1 36 0"/>
  </g>
  <text x="401" y="770" font-size="24" font-weight="700" fill="#0F3B3A">Agency decides</text>

  <path d="M 1216 566 L 1216 694" fill="none" stroke="#D9A43A" stroke-width="3"
        stroke-linecap="round" marker-end="url(#tipAmber)"/>
  <path d="M 1369 730 C 1432 706 1473 648 1473 572" fill="none" stroke="#C7B48A" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="2 10" marker-end="url(#tipAmber)"/>
  <rect x="1066" y="700" width="300" height="120" rx="24" fill="#FFFDF5" stroke="#E7D4A8" stroke-width="2"/>
  <circle cx="1128" cy="760" r="26" fill="#E0A526" opacity="0.14"/>
  <g fill="none" stroke="#B9861A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="1128" cy="752" r="11"/>
    <path d="M 1110 780 a 18 18 0 0 1 36 0"/>
  </g>
  <text x="1170" y="770" font-size="24" font-weight="700" fill="#0F3B3A">Human review</text>

  </g>
</svg>
